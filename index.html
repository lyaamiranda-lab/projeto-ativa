const key='projeto-ativa-preview-v2';const defaultHabits=[{id:'body',title:'Movimentei meu corpo',pillar:'Corpo',icon:'🏃',active:true},{id:'faith',title:'Orei ou li a Bíblia',pillar:'Fé',icon:'📖',active:true},{id:'mind',title:'Fiz uma pausa para mim',pillar:'Mente',icon:'🧘',active:true},{id:'home',title:'Cuidei de uma tarefa da casa',pillar:'Lar',icon:'🏡',active:true},{id:'family',title:'Dediquei tempo à minha família',pillar:'Família',icon:'👩‍👧‍👧',active:true},{id:'couple',title:'Cultivei meu relacionamento',pillar:'Família',icon:'❤️',active:true}];const presets=[{id:'walk',title:'Fiz uma caminhada',pillar:'Corpo',icon:'🚶'},{id:'stretch',title:'Fiz alongamentos',pillar:'Corpo',icon:'🤸'},{id:'water',title:'Bebi água ao longo do dia',pillar:'Corpo',icon:'💧'},{id:'prayer',title:'Fiz minha oração',pillar:'Fé',icon:'🙏'},{id:'bible',title:'Li um trecho da Bíblia',pillar:'Fé',icon:'📖'},{id:'gratitude',title:'Registrei algo pelo qual sou grata',pillar:'Mente',icon:'🌼'},{id:'breathe',title:'Respirei com calma por 5 minutos',pillar:'Mente',icon:'🌬️'},{id:'laundry',title:'Cuidei das roupas',pillar:'Lar',icon:'🧺'},{id:'tidy',title:'Organizei por 10 minutos',pillar:'Lar',icon:'🧹'},{id:'play',title:'Brinquei com minhas filhas',pillar:'Família',icon:'🧸'},{id:'talk',title:'Conversei sem celular',pillar:'Família',icon:'💬'},{id:'rest',title:'Desacelerei antes de dormir',pillar:'Mente',icon:'🌙'}];let data;try{data=JSON.parse(localStorage.getItem(key))||{name:'',habits:defaultHabits,checks:{},notes:{},reminder:'20:30'}}catch{data={name:'',habits:defaultHabits,checks:{},notes:{},reminder:'20:30'}};data={name:'',habits:defaultHabits,checks:{},notes:{},reminder:'20:30',...data};data.habits=data.habits.map(h=>({...h,icon:h.icon||iconFor(h),days:Array.isArray(h.days)?h.days:[0,1,2,3,4,5,6]}));

async function signOut(){if(!supabaseClient)return;const {error}=await supabaseClient.auth.signOut();if(error){setAuthStatus('Não foi possível sair: '+error.message);return}cloudUser=null;setAuthStatus('Você saiu da conta. Seus dados locais continuam neste navegador.');render()}
async function initAuth(){if(!supabaseClient){cloudReady=false;return}supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;tab='Ajustes';render();setAuthStatus('Crie uma nova senha para sua conta.')}});const {data:sessionData}=await supabaseClient.auth.getSession();if(sessionData.session?.user){cloudUser=sessionData.session.user;cloudReady=true}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(t){tab=t;render()}function renderNav(){document.getElementById('nav').innerHTML=[['Hoje','☑'],['Rotina','▦'],['Pilares','✿'],['Evolução','▥']].map(([t,i])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><span>${i}</span>${t}</button>`).join('')}function render(){renderNav();const brandAreas=document.getElementById('brandAreas');if(brandAreas){const chosen=Array.isArray(data.selectedAreas)&&data.selectedAreas.length?onboardingAreas.filter(a=>data.selectedAreas.includes(a.id)).map(a=>a.title.toUpperCase()):['CORPO','MENTE','PROPÓSITO','LAR','CONEXÕES','METAS'];brandAreas.textContent=chosen.join(' · ')}const main=document.getElementById('main');if(welcomeVisible){main.innerHTML='<section class="welcome"><div class="welcome-mark">🌿</div><div class="eyebrow" style="color:#d4e2e2">SEU ESPAÇO, SEU RITMO</div><h1>Bem-vindo ao Projeto Ativa</h1><p>Um espaço para organizar sua vida, cuidar de você e cultivar o que realmente importa. Pequenos passos, no seu tempo.</p><div class="welcome-actions"><button class="welcome-primary" onclick="startWelcome()">Começar minha jornada</button><button class="welcome-secondary" onclick="exploreWelcome()">Explorar o aplicativo primeiro</button></div><div class="welcome-foot">Você pode personalizar sua experiência quando quiser.</div></section>';return}if(setupMode){main.innerHTML=`<section class="welcome"><div class="welcome-mark">🌿</div><div class="eyebrow" style="color:#d4e2e2">SUA JORNADA, SUAS ESCOLHAS</div><h1>O que você quer cultivar?</h1><p>Escolha as áreas que fazem sentido para este momento da sua vida. Você poderá mudar suas escolhas depois.</p></section><section class="panel"><h2>Minhas áreas</h2><p class="muted">Toque para selecionar ou retirar uma área. Não é preciso escolher todas.</p><div class="setup-grid">${onboardingAreas.map(a=>`<button type="button" class="setup-option ${selectedWelcomeAreas.includes(a.id)?'selected':''}" aria-pressed="${selectedWelcomeAreas.includes(a.id)}" onclick="toggleWelcomeArea('${a.id}')"><span class="setup-icon">${a.icon}</span><span class="setup-copy"><b>${a.title}</b><small>${a.desc}</small></span><span class="setup-mark">${selectedWelcomeAreas.includes(a.id)?'✓':'＋'}</span></button>`).join('')}</div><div class="welcome-actions"><button class="primary" onclick="finishWelcome()">Continuar</button><button class="secondary" onclick="skipSetup()">Pular por enquanto</button></div><p class="note">Sua seleção será salva na sua conta quando estiver conectada à sincronização.</p></section>`;return}let checked=data.checks[today()]||[],habits=data.habits.filter(h=>h.active && isAreaEnabled(h.pillar) && (h.days||[0,1,2,3,4,5,6]).includes(new Date().getDay()));if(tab==='Hoje'){main.innerHTML=`<section class="hero"><div class="eyebrow">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${data.name?'Olá, '+esc(data.name)+'!':'Sua vida merece cuidado.'}</h1><p>Pequenos passos. Mais equilíbrio. Mais presença.</p><div class="progresshead"><span>Seu progresso de hoje</span><b>${checked.length} de ${habits.length}</b></div><div class="progress"><span style="width:${habits.length?Math.min(100,checked.length/habits.length*100):0}%"></span></div></section><section class="panel"><div class="titleline"><h2>Meu foco neste momento</h2><span class="muted">${habits.length} hábitos ativos</span></div><p class="muted">Áreas que você escolheu para cuidar no seu ritmo.</p><div class="focus-tags">${onboardingAreas.filter(a=>!Array.isArray(data.selectedAreas)||data.selectedAreas.length===0||data.selectedAreas.includes(a.id)).map(a=>`<span class="focus-tag">${a.icon} ${a.title}</span>`).join('')||'<span class="muted">Nenhuma área selecionada. Você pode escolher em Ajustes.</span>'}</div><div class="sectionlabel">ACESSO RÁPIDO</div><div class="quick-access"><button onclick="go('Rotina')"><span>▦</span>Minha rotina</button><button onclick="go('Pilares')"><span>✿</span>Meus pilares</button><button onclick="go('Evolução')"><span>▥</span>Minha evolução</button></div></section><section class="panel"><div class="titleline"><h2>Meu checklist</h2><b>${habits.length?Math.round(checked.length/habits.length*100):0}%</b></div><p class="muted">Não precisa fazer tudo. Comece pelo que importa.</p>${habits.map(h=>`<label class="habit ${checked.includes(h.id)?'done':''}"><input type="checkbox" ${checked.includes(h.id)?'checked':''} onchange="toggle('${h.id}')"><span class="habiticon" aria-hidden="true">${esc(iconFor(h))}</span><div><b>${esc(h.title)}</b><small>${esc(h.pillar)}</small></div></label>`).join('')}<div class="sectionlabel">HÁBITOS PRÉ-DEFINIDOS · TOQUE PARA ADICIONAR</div><div class="presetgrid">${presets.filter(h=>isAreaEnabled(h.pillar)).map(h=>{let exists=data.habits.some(x=>x.id===h.id);return `<button class="preset" ${exists?'disabled':''} onclick="addPreset('${h.id}')"><span>${h.icon}</span><span>${esc(h.title)}${exists?'<br><small>Já adicionado</small>':''}</span></button>`}).join('')}</div><div class="sectionlabel">OU CRIE SEU PRÓPRIO HÁBITO</div><div class="addform"><input class="wide" id="newhabit" placeholder="Nome do novo hábito"><select id="newicon" aria-label="Ícone do hábito">${icons.map(i=>`<option value="${i}">${i}</option>`).join('')}</select><select id="newpillar" aria-label="Área do hábito"><option>Corpo</option><option>Fé</option><option>Mente</option><option>Lar</option><option>Família</option><option>Pessoal</option></select><button class="primary wide" onclick="addHabit()">＋ Adicionar hábito</button></div></section><section class="panel"><h2>Como quero me sentir?</h2><textarea id="note" rows="3" placeholder="Escreva uma intenção ou conquista...">${esc(data.notes[today()]||'')}</textarea><p class="note">Sua reflexão fica salva neste navegador.</p></section>`;document.getElementById('note').addEventListener('input',e=>{data.notes[today()]=e.target.value;save()});}else if(tab==='Rotina'){let routineDone=data.routineChecks[today()]||[];main.innerHTML=`<section class="panel"><h2>Minha rotina do dia</h2><p class="muted">Estas são apenas sugestões. Edite os horários e atividades, acrescente as suas ou retire o que não fizer sentido para sua vida.</p><div class="stats"><div class="stat"><span>Atividades concluídas hoje</span><b>${routineDone.length}/${data.routineItems.length}</b></div><div class="stat"><span>Seu ritmo</span><b>${data.routineItems.length?Math.round(routineDone.length/data.routineItems.length*100):0}%</b></div></div>${data.routineItems.map((item,index)=>`<div class="routine-card ${routineDone.includes(item.id)?'done':''}"><div class="routine-card-head"><label class="routine-check"><input type="checkbox" ${routineDone.includes(item.id)?'checked':''} onchange="toggleRoutine('${item.id}')"> Concluída</label><button class="secondary danger" onclick="removeRoutine('${item.id}')" aria-label="Excluir atividade">Excluir</button></div><label class="routine-label">Atividade<input type="text" value="${esc(item.title||'') }" placeholder="Digite sua atividade" onchange="editRoutine('${item.id}','title',this.value)"></label><label class="routine-label">Horário (opcional)<input type="time" value="${esc(item.time||'')}" onchange="editRoutine('${item.id}','time',this.value)"></label></div>`).join('')}}<div class="addform"><input id="routineTitle" class="wide" placeholder="Nova atividade para sua rotina"><input id="routineTime" type="time" aria-label="Horário da nova atividade"><button class="primary" onclick="addRoutine()">＋ Adicionar</button></div><p class="note">Você pode deixar o horário em branco. Suas alterações ficam salvas e, quando estiver conectada, são sincronizadas com sua conta.</p></section><section class="panel"><h2>Minha rotina</h2><p class="muted">Escolha um dia para consultar seu foco.</p><div class="days">${days.map((d,i)=>`<button class="${day===i?'sel':''}" onclick="setDay(${i})">${d.slice(0,3)}</button>`).join('')}</div><div class="plan"><span class="eyebrow">${days[day]}</span><div class="planrow"><span class="emoji">🏃</span><div><small>ATIVA CORPO</small><b>${plans[day].exercise}</b><p class="note">30 minutos sugeridos; adapte à sua condição e respeite seus limites.</p></div></div><div class="planrow"><span class="emoji">🏠</span><div><small>ATIVA LAR</small><b>${plans[day].home}</b></div></div><div class="planrow"><span class="emoji">📖</span><div><small>ATIVA ALMA</small><b>${plans[day].faith}</b></div></div></div><p class="note">Sexta-feira é o dia das roupas. O tempo de lavar, estender, dobrar e guardar pode ultrapassar 30 minutos.</p></section><section class="panel"><h2>Meus hábitos por dia</h2><p class="muted">Escolha em quais dias cada hábito aparece no checklist. As alterações são salvas neste aparelho.</p>${data.habits.filter(h=>h.active).map(h=>`<div class="habitsettings"><strong>${esc(iconFor(h))} ${esc(h.title)}</strong><div class="daychecks">${days.map((d,i)=>`<label class="daycheck"><input type="checkbox" ${h.days.includes(i)?'checked':''} onchange="setHabitDay('${h.id}',${i},this.checked)">${d.slice(0,3)}</label>`).join('')}</div></div>`).join('')}</section>`}else if(tab==='Pilares'){const pillarCards=[{id:'corpo',icon:'🏃',title:'Ativa Corpo',desc:'Movimento, saúde, descanso e autocuidado.'},{id:'mente',icon:'🧠',title:'Ativa Mente',desc:'Pausas, emoções, reflexão e bem-estar.'},{id:'proposito',icon:'✨',title:'Ativa Propósito',desc:'Valores, gratidão e espiritualidade, se fizer sentido para você.'},{id:'lar',icon:'🏡',title:'Ativa Lar',desc:'Organização e pequenas tarefas do dia a dia.'},{id:'conexoes',icon:'❤️',title:'Ativa Conexões',desc:'Presença, conversas e relacionamentos.'},{id:'metas',icon:'🎯',title:'Metas pessoais',desc:'Planos, sonhos e objetivos possíveis.'}].filter(x=>!Array.isArray(data.selectedAreas)||data.selectedAreas.length===0||data.selectedAreas.includes(x.id));main.innerHTML=`<section class="panel"><h2>Minhas áreas</h2><p class="muted">Aqui estão as áreas que você escolheu acompanhar. Você pode alterá-las em Ajustes.</p><div class="pillars">${pillarCards.map(x=>`<article class="pillar"><div class="picon">${x.icon}</div><h3>${x.title}</h3><p>${x.desc}</p></article>`).join('')}</div>${pillarCards.length?'':'<p class="muted">Você ainda não selecionou áreas. Vá a Ajustes para personalizar sua experiência.</p>'}<div class="row"><button class="secondary" onclick="editWelcomeAreas()">Personalizar minhas áreas</button></div></section>`}else if(tab==='Evolução'){let entries=Object.entries(data.checks).sort(([a],[b])=>b.localeCompare(a)).slice(0,7);let weekTotal=Object.entries(data.checks).filter(([d])=>{let dt=new Date(d+'T12:00:00'),now=new Date();let start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);let end=new Date(start);end.setDate(start.getDate()+7);return dt>=start&&dt<end}).reduce((n,[,a])=>n+a.length,0);main.innerHTML=`<section class="panel"><h2>Minha evolução</h2><p class="muted">Seu resumo com base nos registros deste aparelho.</p><div class="stats"><div class="stat"><span>Hábitos nesta semana</span><b>${weekTotal}</b></div><div class="stat"><span>Dias com registros</span><b>${entries.length}</b></div></div><h3>Registros recentes</h3>${entries.length?entries.map(([d,a])=>`<div class="habit"><div><b>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</b><small>${a.length} hábitos concluídos</small></div></div>`).join(''):'<p class="muted">Seu progresso começa aqui. Marque hábitos na tela Hoje para construir seu histórico.</p>'}</section>`}else{main.innerHTML=`<section class="panel"><h2>Ajustes</h2><p class="muted">Personalize seu espaço.</p><div class="row"><label for="name">Como podemos chamar você?</label><input class="field" id="name" value="${esc(data.name)}" placeholder="Seu nome ou apelido"></div><div class="row"><label for="reminder">Horário preferido para desacelerar</label><input class="field" id="reminder" type="time" value="${esc(data.reminder)}"></div><div class="row"><label><input id="reminderEnabled" type="checkbox" ${data.reminderEnabled?'checked':''} style="width:auto"> Quero receber lembrete para desacelerar</label><p class="note">A preferência fica salva neste aparelho. Notificações automáticas ainda não estão ativas nesta versão.</p></div><button class="primary" onclick="saveSettings()">Salvar preferências</button><div class="row"><h3>Minha experiência</h3><p class="muted">Escolha as áreas que deseja acompanhar no Projeto Ativa. Você pode mudar essas preferências sempre que quiser.</p><button class="secondary" onclick="editWelcomeAreas()">Personalizar minhas áreas</button></div><div class="row"><h3>Conta e sincronização</h3><p class="muted">Você pode continuar usando sem cadastro. Ao entrar na conta, seus hábitos poderão ser sincronizados entre dispositivos.</p><div class="authbox"><div class="cloudtag">CONTA PROJETO ATIVA</div><div id="authstatus" class="authstatus">${cloudUser?'Conta conectada. As alterações serão sincronizadas com sua conta.':supabaseClient?'Conecte-se com seu e-mail para sincronizar seus hábitos.':'A conexão com o Supabase ainda precisa da chave publicável no arquivo supabase-config.js.'}</div><input id="authEmail" type="email" autocomplete="email" placeholder="Seu e-mail"><input id="authPassword" type="password" autocomplete="current-password" placeholder="Senha (mínimo 8 caracteres)"><button class="secondary" style="width:100%;margin:2px 0 8px" onclick="requestPasswordReset()">Esqueci minha senha</button>${recoveryMode?`<input id="newAccountPassword" type="password" autocomplete="new-password" placeholder="Nova senha (mínimo 8 caracteres)"><button class="primary" style="width:100%;margin-bottom:8px" onclick="updateAccountPassword()">Salvar nova senha</button>`:''}<div class="authbuttons"><button class="primary" onclick="signUp()">Criar conta</button><button class="secondary" onclick="signIn()">Entrar</button><button class="secondary danger" onclick="signOut()">Sair</button></div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="syncToCloud(true)">Sincronizar agora</button></div></div></div><p class="note">Os dados continuam salvos neste navegador. A sincronização só funcionará depois que a chave publicável estiver configurada e as políticas de segurança do banco estiverem corretas. Nunca coloque uma chave secreta neste aplicativo.</p></section>`}}function startWelcome(){welcomeVisible=false;setupMode=true;render()}function exploreWelcome(){welcomeVisible=false;data.onboardingCompleted=true;save();tab='Hoje';render()}function editWelcomeAreas(){selectedWelcomeAreas=Array.isArray(data.selectedAreas)?[...data.selectedAreas]:[];setupMode=true;render()}function toggleWelcomeArea(id){selectedWelcomeAreas=selectedWelcomeAreas.includes(id)?selectedWelcomeAreas.filter(x=>x!==id):[...selectedWelcomeAreas,id];render()}function finishWelcome(){data.selectedAreas=[...selectedWelcomeAreas];data.onboardingCompleted=true;setupMode=false;save();tab='Hoje';render()}function skipSetup(){data.onboardingCompleted=true;setupMode=false;save();tab='Hoje';render()}function toggleRoutine(id){let a=data.routineChecks[today()]||[];data.routineChecks[today()]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();render()}function editRoutine(id,field,value){let item=data.routineItems.find(x=>x.id===id);if(!item)return;item[field]=value;save()}function addRoutine(){let title=document.getElementById('routineTitle').value.trim();if(!title)return;let time=document.getElementById('routineTime').value;data.routineItems.push({id:'routine-'+Date.now(),time,title});save();render()}function removeRoutine(id){data.routineItems=data.routineItems.filter(x=>x.id!==id);for(const d of Object.keys(data.routineChecks))data.routineChecks[d]=(data.routineChecks[d]||[]).filter(x=>x!==id);save();render()}function toggle(id){let c=data.checks[today()]||[];data.checks[today()]=c.includes(id)?c.filter(x=>x!==id):[...c,id];save();render()}function addHabit(){let el=document.getElementById('newhabit'),title=el.value.trim();if(!title)return;let icon=document.getElementById('newicon').value,pillar=document.getElementById('newpillar').value;data.habits.push({id:'custom-'+Date.now(),title,pillar,icon,active:true,days:[0,1,2,3,4,5,6]});save();render()}function addPreset(id){let h=presets.find(x=>x.id===id);if(!h||data.habits.some(x=>x.id===id))return;data.habits.push({...h,active:true,days:[0,1,2,3,4,5,6]});save();render()}function setDay(i){day=i;render()}function setHabitDay(id,d,enabled){let h=data.habits.find(x=>x.id===id);if(!h)return;h.days=h.days||[0,1,2,3,4,5,6];h.days=enabled?[...new Set([...h.days,d])]:h.days.filter(x=>x!==d);if(!h.days.length){h.days=[d];alert('Um hábito precisa estar programado para pelo menos um dia. Mantivemos este dia selecionado.')}save();render()}function saveSettings(){data.name=document.getElementById('name').value.trim();data.reminder=document.getElementById('reminder').value||'20:30';data.reminderEnabled=document.getElementById('reminderEnabled').checked;save();render();alert('Preferências salvas neste navegador. O horário fica registrado, mas as notificações automáticas ainda não estão ativas nesta demonstração.')}render();initAuth();

// Registra o service worker para permitir instalação e uso offline básico.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker não registrado:', err)); });
}
</script></body></html>
