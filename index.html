 class="calendar-grid">${monthCalendar.map(d=>d?'<button type="button" class="calendar-cell '+(d.count?'has-progress':'')+' '+(d.isToday?'is-today':'')+'" aria-label="Ver registros de '+d.n+'" onclick="showCalendarDay(\''+d.key+'\')"><b>'+d.n+'</b><small>'+(d.count+d.routineCount?((d.count?d.count+' hábitos':'')+(d.count&&d.routineCount?' · ':'')+(d.routineCount?d.routineCount+' rotina':'')):'·')+'</small></button>':'<div class="calendar-cell empty"></div>').join('')}</div><p class="note">Os números mostram hábitos e atividades da rotina concluídos. Toque em uma data para ver os detalhes.</p>${calendarDetailsHtml()}<h3>Últimos 7 dias</h3><div class="progress-week">${days7.map(d=>`<div class="progress-day"><b>${d.date.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</b><div class="progress-track"><span style="height:${d.pct}%;"></span></div><small>${d.done}/${d.planned}</small></div>`).join('')}</div><p class="note">O percentual compara hábitos concluídos com hábitos ativos programados para cada dia. Dias sem hábitos programados não entram no cálculo.</p><div class="encouragement">🌿 ${encouragement}</div><p class="note">No total, você já registrou ${totalRoutineDone} atividades da rotina desde o início do acompanhamento.</p><h3>Minhas conquistas</h3><p class="muted">Cada passo conta. Sem sequência perfeita e sem cobranças.</p><div class="achievement-list"><div class="achievement ${totalDone>=1?'earned':''}"><span>🌱</span><div><b>Primeiro passo</b><small>${totalDone>=1?'Conquista alcançada!':'Ainda não desbloqueada'}</small></div></div><div class="achievement ${recordedDays>=7?'earned':''}"><span>🌿</span><div><b>Uma semana de registros</b><small>${recordedDays} de 7 dias diferentes</small></div></div><div class="achievement ${totalDone>=10?'earned':''}"><span>⭐</span><div><b>10 pequenas conquistas</b><small>${totalDone} de 10 hábitos concluídos</small></div></div><div class="achievement ${totalDone>=30?'earned':''}"><span>💚</span><div><b>30 pequenas conquistas</b><small>${totalDone} de 30 hábitos concluídos</small></div></div><div class="achievement ${totalDone>=100?'earned':''}"><span>🏆</span><div><b>100 pequenas conquistas</b><small>${totalDone} de 100 hábitos concluídos</small></div></div></div><h3>Registros recentes</h3>${recentDates.length?recentDates.map(d=>{const habits=(data.checks?.[d]||[]).length,routines=(data.routineChecks?.[d]||[]).length;return `<div class="habit"><div><b>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}</b><small>${habits} hábitos · ${routines} atividades da rotina</small></div></div>`}).join(''):'<p class="muted">Seu progresso começa aqui. Marque hábitos ou atividades da rotina para construir seu histórico.</p>'}</section>`}else{main.innerHTML=`<section class="panel"><h2>Ajustes</h2><p class="muted">Personalize seu espaço.</p><div class="row"><label for="name">Como podemos chamar você?</label><input class="field" id="name" value="${esc(data.name)}" placeholder="Seu nome ou apelido"></div><div class="row"><label for="reminder">Horário preferido para desacelerar</label><input class="field" id="reminder" type="time" value="${esc(data.reminder)}"></div><div class="row"><label><input id="reminderEnabled" type="checkbox" ${data.reminderEnabled?'checked':''} style="width:auto"> Quero receber lembrete para desacelerar</label><p class="note">Este ajuste registra seu horário preferido neste aparelho. Ele ainda não agenda nem envia notificações automáticas.</p></div><button class="primary" onclick="saveSettings()">Salvar preferências</button><div class="row"><h3>Backup dos meus dados</h3><p class="muted">Salve uma cópia dos seus hábitos, registros, rotina e metas ou restaure um arquivo anterior.</p><div class="actions"><button class="secondary" onclick="exportBackup()">Baixar meu backup</button><label class="secondary" for="backupFile">Restaurar backup</label>${hasLocalRecoveryBackup()?'<button class="secondary" onclick="downloadLocalRecoveryBackup()">Baixar cópia anterior à nuvem</button><button class="secondary" onclick="restoreLocalRecoveryBackup()">Recuperar cópia anterior à nuvem</button>':''}<input id="backupFile" type="file" accept="application/json,.json" onchange="importBackup(this)" style="display:none"></div></div><div class="row"><h3>Minha experiência</h3><p class="muted">Escolha as áreas que deseja acompanhar no Projeto Ativa. Você pode mudar essas preferências sempre que quiser.</p><button class="secondary" onclick="editWelcomeAreas()">Personalizar minhas áreas</button></div><div class="row"><h3>Conta e sincronização</h3><p class="muted">Você pode continuar usando sem cadastro. Ao entrar na conta, seus hábitos poderão ser sincronizados entre dispositivos.</p><div class="authbox"><div class="cloudtag">CONTA PROJETO ATIVA</div><div id="authstatus" class="authstatus" role="status" aria-live="polite">${cloudUser?'Conta conectada. As alterações serão sincronizadas com sua conta.':supabaseClient?'Conecte-se com seu e-mail para sincronizar seus hábitos.':'A conexão com o Supabase ainda precisa da chave publicável no arquivo supabase-config.js.'}</div><input id="authEmail" type="email" autocomplete="email" placeholder="Seu e-mail"><input id="authPassword" type="password" autocomplete="current-password" placeholder="Senha (mínimo 8 caracteres)"><button class="secondary" style="width:100%;margin:2px 0 8px" onclick="requestPasswordReset()">Esqueci minha senha</button>${recoveryMode?`<input id="newAccountPassword" type="password" autocomplete="new-password" placeholder="Nova senha (mínimo 8 caracteres)"><button class="primary" style="width:100%;margin-bottom:8px" onclick="updateAccountPassword()">Salvar nova senha</button>`:''}<div class="authbuttons"><button class="primary" onclick="signUp()">Criar conta</button><button class="secondary" onclick="signIn()">Entrar</button><button class="secondary danger" onclick="signOut()">Sair</button></div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="syncNow()">Sincronizar agora</button></div></div></div><p class="note">Seus dados ficam salvos neste navegador e, quando você entra na sua conta, também são sincronizados com a nuvem. Se houver alterações conflitantes entre aparelhos, a sincronização será pausada para proteger seus registros. Nunca compartilhe sua senha ou códigos de acesso.</p></section>`}}function startWelcome(){welcomeVisible=false;setupMode=true;render()}function exploreWelcome(){welcomeVisible=false;data.onboardingCompleted=true;save();tab='Hoje';render()}function editWelcomeAreas(){selectedWelcomeAreas=Array.isArray(data.selectedAreas)?[...data.selectedAreas]:[];setupMode=true;render()}function toggleWelcomeArea(id){if(!onboardingAreas.some(area=>area.id===id))return;const alreadySelected=selectedWelcomeAreas.includes(id);if(alreadySelected&&selectedWelcomeAreas.length<=1){alert('Escolha pelo menos uma área para acompanhar no Projeto Ativa.');return}selectedWelcomeAreas=alreadySelected?selectedWelcomeAreas.filter(x=>x!==id):[...selectedWelcomeAreas,id];render()}function finishWelcome(){const previous={selectedAreas:Array.isArray(data.selectedAreas)?[...data.selectedAreas]:data.selectedAreas,onboardingCompleted:data.onboardingCompleted};data.selectedAreas=[...selectedWelcomeAreas];data.onboardingCompleted=true;if(!save()){data.selectedAreas=previous.selectedAreas;data.onboardingCompleted=previous.onboardingCompleted;setupMode=true;render();alert('Não foi possível salvar suas escolhas. Elas continuam disponíveis nesta tela; tente novamente.');return}setupMode=false;tab='Hoje';render()}function skipSetup(){const previous=data.onboardingCompleted;data.onboardingCompleted=true;if(!save()){data.onboardingCompleted=previous;setupMode=true;render();alert('Não foi possível salvar esta escolha. Tente novamente ou continue personalizando o aplicativo.');return}setupMode=false;tab='Hoje';render()}function toggleRoutine(id){const previous=[...(data.routineChecks[today()]||[])];data.routineChecks[today()]=previous.includes(id)?previous.filter(x=>x!==id):[...previous,id];if(!save()){data.routineChecks[today()]=previous;render();alert('Não foi possível salvar este registro da rotina. O estado anterior foi mantido.');return}render()}function editRoutine(id,field,value){let item=data.routineItems.find(x=>x.id===id);if(!item)return;if(field==='title'){value=String(value).trim();if(!value){alert('A atividade precisa ter um nome.');render();return}}const previous=item[field];item[field]=value;if(!save()){item[field]=previous;render();alert('Não foi possível salvar a edição. A atividade foi mantida como estava.');return}render()}function addRoutine(){let title=document.getElementById('routineTitle').value.trim();if(!title){alert('Digite o nome da atividade.');return}let time=document.getElementById('routineTime').value;const item={id:'routine-'+Date.now(),time,title};data.routineItems.push(item);if(!save()){data.routineItems=data.routineItems.filter(x=>x!==item);alert('Não foi possível salvar a atividade. Seus dados anteriores foram mantidos.');return}render()}function removeRoutine(id){const index=data.routineItems.findIndex(x=>x.id===id);if(index<0)return;const item=data.routineItems[index];const previousChecks=Object.fromEntries(Object.entries(data.routineChecks).map(([date,list])=>[date,[...list]]));data.routineItems.splice(index,1);for(const d of Object.keys(data.routineChecks))data.routineChecks[d]=(data.routineChecks[d]||[]).filter(x=>x!==id);if(!save()){data.routineItems.splice(index,0,item);data.routineChecks=previousChecks;render();alert('Não foi possível salvar a exclusão. A atividade e seus registros foram mantidos.');return}render()}function setHabitPriority(id,priority){if(!['essential','important','optional'].includes(priority))return;let h=data.habits.find(x=>x.id===id);if(!h)return;const previous=h.priority;h.priority=priority;if(!save()){h.priority=previous;render();alert('Não foi possível salvar a prioridade. O valor anterior foi mantido.');return}render()}function toggle(id){const previous=[...(data.checks[today()]||[])];data.checks[today()]=previous.includes(id)?previous.filter(x=>x!==id):[...previous,id];if(!save()){data.checks[today()]=previous;render();alert('Não foi possível salvar este registro do hábito. O estado anterior foi mantido.');return}render()}function addHabit(){let el=document.getElementById('newhabit'),title=el.value.trim();if(!title){alert('Digite o nome do hábito.');return}let icon=document.getElementById('newicon').value,pillar=document.getElementById('newpillar').value,priority=document.getElementById('newpriority').value,selectedDays=Array.from(document.querySelectorAll('input[name="newday"]:checked')).map(x=>Number(x.value));if(!selectedDays.length){alert('Escolha pelo menos um dia da semana.');return}const habit={id:'custom-'+Date.now(),title,pillar,icon,active:true,priority,days:selectedDays};data.habits.push(habit);if(!save()){data.habits=data.habits.filter(x=>x!==habit);alert('Não foi possível salvar o novo hábito neste aparelho. Seus dados anteriores foram mantidos.');return}render()}function addPreset(id){let h=presets.find(x=>x.id===id);if(!h||data.habits.some(x=>x.id===id))return;const habit={...h,active:true,priority:'important',days:[0,1,2,3,4,5,6]};data.habits.push(habit);if(!save()){data.habits=data.habits.filter(x=>x!==habit);alert('Não foi possível adicionar este hábito. Verifique o armazenamento do navegador.');return}render()}function editHabit(id,field,value){let h=data.habits.find(x=>x.id===id);if(!h)return;if(field==='title'){value=String(value).trim();if(!value){alert('O nome do hábito não pode ficar vazio.');render();return}}if(field==='priority'&&!['essential','important','optional'].includes(value))return;if(field==='pillar'&&!['Corpo','Mente','Fé','Lar','Família','Pessoal'].includes(value))return;if(!['title','priority','pillar','icon','active'].includes(field))return;const previous=h[field];h[field]=value;if(!save()){h[field]=previous;render();alert('Não foi possível salvar a alteração. O hábito foi mantido como estava.');return}render()}function deleteHabit(id){let index=data.habits.findIndex(x=>x.id===id);if(index<0)return;let h=data.habits[index];if(!confirm('Excluir o hábito “'+h.title+'”? Os registros antigos de conclusão serão preservados.'))return;data.habits.splice(index,1);if(!save()){data.habits.splice(index,0,h);render();alert('Não foi possível salvar a exclusão. O hábito foi mantido.');return}render()}function addGoal(){const title=document.getElementById('goalTitle')?.value.trim();if(!title){alert('Digite o que deseja alcançar.');return}if(title.length>100){alert('A meta deve ter no máximo 100 caracteres.');return}const due=document.getElementById('goalDate')?.value||'';if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)){alert('Informe um prazo válido para a meta.');return}if(due){const date=new Date(due+'T12:00:00');if(Number.isNaN(date.getTime())||date.toISOString().slice(0,10)!==due){alert('Informe uma data válida para a meta.');return}}const allowedAreas=['Corpo','Mente','Propósito','Lar','Conexões','Pessoal'];const selectedArea=document.getElementById('goalArea')?.value||'Pessoal';if(!allowedAreas.includes(selectedArea)){alert('Escolha uma área válida para a meta.');return}const area=selectedArea;const goal={id:'goal-'+Date.now(),title,due,area,progress:0,done:false,createdAt:today()};data.goals.push(goal);if(!save()){data.goals=data.goals.filter(x=>x!==goal);alert('Não foi possível salvar esta meta neste aparelho. Seus dados anteriores foram mantidos.');return}render()}function updateGoalProgress(id,value){const g=data.goals.find(x=>x.id===id);if(!g)return;const numericValue=Number(value);if(!Number.isFinite(numericValue))return;const previous=g.progress;g.progress=Math.max(0,Math.min(100,numericValue));if(!save()){g.progress=previous;render();alert('Não foi possível salvar o progresso. O valor anterior foi mantido.');return}render()}function completeGoal(id){const g=data.goals.find(x=>x.id===id);if(!g)return;const previous={done:g.done,progress:g.progress};g.done=true;g.progress=100;if(!save()){g.done=previous.done;g.progress=previous.progress;render();alert('Não foi possível concluir a meta. Os dados anteriores foram mantidos.');return}render()}function deleteGoal(id){const index=data.goals.findIndex(x=>x.id===id);if(index<0)return;const g=data.goals[index];if(!confirm('Excluir a meta “'+g.title+'”?'))return;data.goals.splice(index,1);if(!save()){data.goals.splice(index,0,g);render();alert('Não foi possível salvar a exclusão. A meta foi mantida.');return}render()}function setDay(i){day=i;render()}function setHabitDay(id,d,enabled){if(!Number.isInteger(d)||d<0||d>6||typeof enabled!=='boolean')return;let h=data.habits.find(x=>x.id===id);if(!h)return;const previous=Array.isArray(h.days)?[...h.days]:[0,1,2,3,4,5,6];h.days=enabled?[...new Set([...previous,d])]:previous.filter(x=>x!==d);if(!h.days.length){h.days=[d];alert('Um hábito precisa estar programado para pelo menos um dia. Mantivemos este dia selecionado.')}if(!save()){h.days=previous;render();alert('Não foi possível salvar os dias do hábito. A programação anterior foi mantida.');return}render()}function exportBackup(){let url=null;try{const payload={app:'Projeto Ativa',version:1,exportedAt:new Date().toISOString(),data:data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='projeto-ativa-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{if(url)URL.revokeObjectURL(url)},1500);setAuthStatus('Backup preparado para download. Confira se o arquivo foi salvo e guarde-o em local seguro.')}catch(error){if(url)URL.revokeObjectURL(url);console.error('Falha ao gerar backup:',error);setAuthStatus('Não foi possível gerar o backup. Seus dados continuam neste aparelho. Tente novamente ou verifique as permissões de download do navegador.')}}function importBackup(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>5*1024*1024){alert('O arquivo é muito grande para ser um backup válido.');input.value='';return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const incoming=parsed?.data||parsed;const plainObject=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);if(!plainObject(incoming)||!Array.isArray(incoming.habits)||!plainObject(incoming.checks))throw new Error('Estrutura inválida');if(!incoming.habits.every(h=>plainObject(h)&&typeof h.id==='string'&&typeof h.title==='string'))throw new Error('Hábitos inválidos');if(!Object.values(incoming.checks).every(list=>Array.isArray(list)&&list.every(id=>typeof id==='string')))throw new Error('Registros inválidos');if(incoming.routineItems!==undefined&&(!Array.isArray(incoming.routineItems)||!incoming.routineItems.every(item=>plainObject(item)&&typeof item.title==='string')))throw new Error('Rotina inválida');if(incoming.goals!==undefined&&(!Array.isArray(incoming.goals)||!incoming.goals.every(goal=>plainObject(goal)&&typeof goal.title==='string')))throw new Error('Metas inválidas');if(incoming.routineChecks!==undefined&&(!plainObject(incoming.routineChecks)||!Object.entries(incoming.routineChecks).every(([date,list])=>/^\\d{4}-\\d{2}-\\d{2}$/.test(date)&&Array.isArray(list)&&list.every(id=>typeof id==='string'))))throw new Error('Registros da rotina inválidos');if(incoming.notes!==undefined&&!plainObject(incoming.notes))throw new Error('Anotações inválidas');if(incoming.selectedAreas!==undefined&&(!Array.isArray(incoming.selectedAreas)||!incoming.selectedAreas.every(area=>typeof area==='string')))throw new Error('Preferências de áreas inválidas');if(!confirm('Importar este backup substituirá os dados atuais deste aparelho. Deseja continuar?'))return;const previousData=data;data=window.ProjetoAtivaPhase2.normalize({...data,...incoming});data.goals=Array.isArray(data.goals)?data.goals:[];if(!save()){data=previousData;render();alert('Não foi possível salvar o backup neste aparelho. Seus dados anteriores foram mantidos. Verifique o espaço disponível no navegador.');return}render();alert('Backup restaurado neste aparelho. Se sua conta estiver conectada, a sincronização com a nuvem será iniciada em seguida.')}catch(err){alert('Não foi possível importar: o arquivo está inválido, incompleto ou danificado. Seus dados atuais foram mantidos.')}finally{input.value=''}};reader.onerror=()=>{alert('Não foi possível ler o arquivo. Seus dados atuais foram mantidos.');input.value=''};reader.readAsText(file)}function saveSettings(){const previous={name:data.name,reminder:data.reminder,reminderEnabled:data.reminderEnabled};const reminderInput=document.getElementById('reminder').value;const reminderValid=/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(reminderInput);if(!reminderValid){alert('Escolha um horário válido para salvar sua preferência.');document.getElementById('reminder').focus();return}data.name=document.getElementById('name').value.trim();data.reminder=reminderInput;data.reminderEnabled=document.getElementById('reminderEnabled').checked;if(!save()){data.name=previous.name;data.reminder=previous.reminder;data.reminderEnabled=previous.reminderEnabled;render();alert('Não foi possível salvar suas preferências neste aparelho. As configurações anteriores foram mantidas. Verifique o espaço disponível no navegador.');return}render();alert('Preferências salvas neste navegador. O horário ficou registrado; lembretes automáticos ainda não estão disponíveis.')}render();initAuth();

// Ao recuperar a conexão, tenta enviar alterações locais pendentes para a nuvem.
window.addEventListener('online', () => {
  if (cloudUser && supabaseClient && !cloudConflict) {
    setAuthStatus('Conexão restabelecida. Tentando sincronizar seus dados...');
    syncToCloud(true);
  }
});
window.addEventListener('offline', () => {
  if (cloudUser) setAuthStatus('Você está sem conexão. Seus dados continuam salvos neste aparelho; a sincronização será tentada quando a internet voltar.');
});

// Registra o service worker para permitir instalação e uso offline básico.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker não registrado:', err)); });
}
</script></body></html>
