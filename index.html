<style>
:root{--g:#466b55;--gd:#344a3b;--gl:#e8eee5;--bg:#f6f5ef;--muted:#718076;--line:#e5e9e2;--gold:#f5eedc;--blue:#eaf0f6;--rose:#f4e7e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#2f3d33;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:560px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:88px}.top{display:flex;align-items:center;gap:12px;background:white;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.logo{display:grid;place-items:center;background:var(--gl);color:var(--g);height:44px;width:44px;border-radius:14px;font-size:24px}.brand{flex:1}.brand strong{display:block;font:700 20px Georgia,serif;color:var(--gd)}.brand small{font-size:10px;color:var(--muted);letter-spacing:.08em}.iconbtn{border:0;background:var(--gl);color:var(--g);border-radius:50%;width:38px;height:38px;font-size:18px}main{padding:15px;display:grid;gap:14px}.hero{background:var(--g);color:white;padding:22px;border-radius:22px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}.hero .eyebrow{color:#d8e5d9}.hero h1{font:700 27px/1.2 Georgia,serif;margin:0 0 8px}.hero p{font-size:13px;color:#e8efe8;line-height:1.5}.progresshead{display:flex;justify-content:space-between;font-size:12px;margin:20px 0 7px}.progress{height:7px;background:#ffffff40;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#e8d9a9;width:0;transition:width .2s}.panel{background:white;border:1px solid #e9ece6;border-radius:19px;padding:17px}.titleline{display:flex;justify-content:space-between;align-items:center;gap:8px}.panel h2{font:700 21px Georgia,serif;color:var(--gd);margin:0 0 6px}.panel h3{font-size:14px;color:var(--gd);margin:0 0 8px}.muted,.micro{font-size:12px;color:var(--muted);line-height:1.5}.habit{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf0eb}.habit input{width:20px;height:20px;accent-color:var(--g);flex-shrink:0}.habiticon{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:12px;background:var(--gl);font-size:19px}.habit div{flex:1}.habit small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.habit.done b{text-decoration:line-through;color:#8a978c}.add{display:flex;gap:8px;margin-top:13px}.presetgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.preset{display:flex;align-items:center;gap:8px;text-align:left;background:#fcfcf9;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--gd);font-size:12px;line-height:1.3}.preset span:first-child{font-size:20px}.preset:disabled{opacity:.5}.sectionlabel{font-size:10px;letter-spacing:.08em;font-weight:800;color:var(--muted);margin:16px 0 8px}.add input,input,textarea,select{font:inherit}.add input,.field,textarea,select{min-width:0;width:100%;border:1px solid #dfe5dc;background:#fcfcf9;border-radius:11px;padding:11px;color:var(--gd)}button{font:inherit;cursor:pointer}.add button,.primary{border:0;border-radius:11px;background:var(--g);color:white;padding:10px 14px;font-weight:700}.days{display:flex;gap:6px;overflow:auto;padding:12px 0}.days button{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 11px;color:var(--muted);white-space:nowrap}.days button.sel{background:var(--g);color:white}.plan{background:#f7f8f3;border-radius:14px;padding:14px}.planrow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #e4e9df}.planrow:last-child{border:0}.planrow .emoji{font-size:20px}.planrow b{display:block;font-size:13px}.planrow small{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em}.pillars{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pillar{border:1px solid var(--line);border-radius:14px;padding:14px}.picon{font-size:24px;margin-bottom:7px}.pillar p{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f4f7f1;border-radius:14px;padding:15px}.stat span{display:block;font-size:11px;color:var(--muted)}.stat b{display:block;font:700 27px Georgia,serif;color:var(--g);margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;justify-content:space-around;background:#ffffffed;border-top:1px solid var(--line);padding:8px 3px max(9px,env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:3}.nav button{border:0;background:transparent;color:#89928a;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:5px;flex:1}.nav button.active{color:var(--g);font-weight:800}.nav button span:first-child{font-size:18px}.hidden{display:none!important}.note{font-size:11px;color:var(--muted);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{border:1px solid var(--line);background:white;color:var(--g);border-radius:11px;padding:10px 13px}.row{margin:12px 0}.row label{display:block;font-size:12px;font-weight:700;color:var(--gd);margin-bottom:6px}.daychecks{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.daycheck{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:#fff;font-size:11px;color:var(--gd)}.daycheck input{accent-color:var(--g)}.habitsettings{padding:12px 0;border-bottom:1px solid var(--line)}.habitsettings strong{font-size:13px}.habitsettings .daychecks{margin-bottom:0}.addform{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:10px}.addform .wide{grid-column:1/-1}.subhead{font-size:13px;font-weight:800;color:var(--gd);margin:15px 0 6px}.toast{background:var(--gl);padding:11px;border-radius:10px;color:var(--gd);font-size:12px;display:none}@media(min-width:600px){body{padding:18px 0}.app{min-height:calc(100vh - 36px);border:1px solid var(--line);border-radius:24px;overflow:hidden}.top{position:relative}.nav{bottom:18px;border:1px solid var(--line);border-radius:0 0 24px 24px}}
.authbox{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px;background:#fcfcf9}.authbox input{display:block;width:100%;margin:8px 0;border:1px solid #dfe5dc;background:white;border-radius:10px;padding:11px;color:var(--gd)}.authstatus{font-size:12px;line-height:1.5;color:var(--g);margin:8px 0}.authbuttons{display:flex;gap:8px;flex-wrap:wrap}.authbuttons button{flex:1;min-width:120px}.danger{color:#8a3c35;border-color:#e8d0ce}.cloudtag{font-size:10px;letter-spacing:.06em;font-weight:800;color:var(--g)}
</style></head><body><div class="app">
<header class="top"><div class="logo">🌿</div><div class="brand"><strong>Projeto Ativa</strong><small>CORPO · MENTE · FÉ · LAR · FAMÍLIA</small></div><button class="iconbtn" onclick="go('Ajustes')" aria-label="Abrir ajustes">⚙</button></header>
<main id="main"></main><nav class="nav" id="nav"></nav></div>

<script src="./supabase-config.js"></script>
<script>
const key='projeto-ativa-preview-v2';const defaultHabits=[{id:'body',title:'Movimentei meu corpo',pillar:'Corpo',icon:'🏃',active:true},{id:'faith',title:'Orei ou li a Bíblia',pillar:'Fé',icon:'📖',active:true},{id:'mind',title:'Fiz uma pausa para mim',pillar:'Mente',icon:'🧘',active:true},{id:'home',title:'Cuidei de uma tarefa da casa',pillar:'Lar',icon:'🏡',active:true},{id:'family',title:'Dediquei tempo à minha família',pillar:'Família',icon:'👩‍👧‍👧',active:true},{id:'couple',title:'Cultivei meu relacionamento',pillar:'Família',icon:'❤️',active:true}];const presets=[{id:'walk',title:'Fiz uma caminhada',pillar:'Corpo',icon:'🚶'},{id:'stretch',title:'Fiz alongamentos',pillar:'Corpo',icon:'🤸'},{id:'water',title:'Bebi água ao longo do dia',pillar:'Corpo',icon:'💧'},{id:'prayer',title:'Fiz minha oração',pillar:'Fé',icon:'🙏'},{id:'bible',title:'Li um trecho da Bíblia',pillar:'Fé',icon:'📖'},{id:'gratitude',title:'Registrei algo pelo qual sou grata',pillar:'Mente',icon:'🌼'},{id:'breathe',title:'Respirei com calma por 5 minutos',pillar:'Mente',icon:'🌬️'},{id:'laundry',title:'Cuidei das roupas',pillar:'Lar',icon:'🧺'},{id:'tidy',title:'Organizei por 10 minutos',pillar:'Lar',icon:'🧹'},{id:'play',title:'Brinquei com minhas filhas',pillar:'Família',icon:'🧸'},{id:'talk',title:'Conversei sem celular',pillar:'Família',icon:'💬'},{id:'rest',title:'Desacelerei antes de dormir',pillar:'Mente',icon:'🌙'}];let data;try{data=JSON.parse(localStorage.getItem(key))||{name:'',habits:defaultHabits,checks:{},notes:{},reminder:'20:30'}}catch{data={name:'',habits:defaultHabits,checks:{},notes:{},reminder:'20:30'}};data={name:'',habits:defaultHabits,checks:{},notes:{},reminder:'20:30',...data};data.habits=data.habits.map(h=>({...h,icon:h.icon||iconFor(h),days:Array.isArray(h.days)?h.days:[0,1,2,3,4,5,6]}));let tab='Hoje',day=new Date().getDay();const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];const icons=['✨','🏃','🚶','💧','🤸','🙏','📖','🌼','🌬️','🧺','🧹','🧸','💬','🌙','🏡','❤️','🧘','🌿'];const plans=[{exercise:'Recuperação ou mobilidade suave',home:'Organização leve da semana',faith:'Salmo 121'},{exercise:'Pernas e glúteos',home:'Banheiros',faith:'Salmo 23'},{exercise:'Braços, costas e postura',home:'Quartos e roupas de cama',faith:'Mateus 6:25–34'},{exercise:'Caminhada e mobilidade',home:'Cozinha e geladeira',faith:'Filipenses 4:4–9'},{exercise:'Pernas e quadril',home:'Sala e organização geral',faith:'Salmo 46:10'},{exercise:'Corpo inteiro',home:'Roupas: lavar, estender, dobrar e guardar',faith:'Provérbios 3:5–6'},{exercise:'Movimento prazeroso em família',home:'Uma tarefa maior compartilhada',faith:'1 Coríntios 13:4–7'}];function iconFor(h){if(h.icon)return h.icon;const p={Corpo:'🏃',Fé:'📖',Mente:'🧘',Lar:'🏡',Família:'❤️',Pessoal:'✨'};return p[h.pillar]||'🌿'}function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}let supabaseClient=null,cloudUser=null,cloudTimer=null,cloudReady=false;
const cloudConfig=window.PROJETO_ATIVA_CONFIG||{};
if(window.supabase?.createClient && cloudConfig.url && cloudConfig.publishableKey && !cloudConfig.publishableKey.includes('COLE_A_CHAVE')){
  try{supabaseClient=window.supabase.createClient(cloudConfig.url,cloudConfig.publishableKey)}catch(err){console.error('Falha ao iniciar Supabase',err)}
}
function setAuthStatus(message){const el=document.getElementById('authstatus');if(el)el.textContent=message}
function save(){localStorage.setItem(key,JSON.stringify(data));if(cloudUser&&supabaseClient){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>syncToCloud(false),900)}}
async function syncToCloud(showMessage=true){if(!supabaseClient||!cloudUser)return;const payload={user_id:cloudUser.id,app_data:data,updated_at:new Date().toISOString()};const {error}=await supabaseClient.from('user_app_data').upsert(payload,{onConflict:'user_id'});if(error){console.error(error);if(showMessage)setAuthStatus('Não foi possível sincronizar. Verifique a conexão e as políticas do banco.')}else if(showMessage)setAuthStatus('Seus hábitos foram sincronizados com sua conta.');}
async function loadCloudAfterLogin(user){cloudUser=user;const {data:row,error}=await supabaseClient.from('user_app_data').select('app_data').eq('user_id',user.id).maybeSingle();if(error){setAuthStatus('Login realizado, mas não foi possível ler os dados da nuvem. Confira a tabela e as políticas RLS.');return}
 if(row&&row.app_data){const localHasProgress=Object.keys(data.checks||{}).length>0||data.habits?.some(h=>String(h.id).startsWith('custom-'));if(localHasProgress){const useCloud=confirm('Encontramos dados salvos na nuvem.\n\nOK = carregar os dados da nuvem neste aparelho.\nCancelar = manter os dados deste aparelho e enviá-los para a nuvem.');if(useCloud){data={...data,...row.app_data};save();render();setAuthStatus('Dados da nuvem carregados neste aparelho.')}else{await syncToCloud(false);setAuthStatus('Os dados deste aparelho foram mantidos e enviados para sua conta.')}}else{data={...data,...row.app_data};save();render();setAuthStatus('Dados da nuvem carregados neste aparelho.')}}else{await syncToCloud(false);setAuthStatus('Conta conectada. Seus dados deste aparelho foram copiados para a nuvem.')}render();}
async function signUp(){if(!supabaseClient){setAuthStatus('Falta configurar a chave publicável no arquivo supabase-config.js.');return}const email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPassword')?.value;if(!email||!password){setAuthStatus('Informe seu e-mail e uma senha com pelo menos 8 caracteres.');return}if(password.length<8){setAuthStatus('Use uma senha com pelo menos 8 caracteres.');return}const {data:result,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:window.location.href.split('#')[0]}});if(error){setAuthStatus('Não foi possível criar a conta: '+error.message);return}if(result.session&&result.user){await loadCloudAfterLogin(result.user)}else{setAuthStatus('Cadastro iniciado! Confira seu e-mail para confirmar a conta e depois entre no aplicativo.')}}
async function signIn(){if(!supabaseClient){setAuthStatus('Falta configurar a chave publicável no arquivo supabase-config.js.');return}const email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPassword')?.value;if(!email||!password){setAuthStatus('Informe e-mail e senha.');return}const {data:result,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){setAuthStatus('Não foi possível entrar: '+error.message);return}await loadCloudAfterLogin(result.user)}
async function signOut(){if(!supabaseClient)return;const {error}=await supabaseClient.auth.signOut();if(error){setAuthStatus('Não foi possível sair: '+error.message);return}cloudUser=null;setAuthStatus('Você saiu da conta. Seus dados locais continuam neste navegador.');render()}
async function initAuth(){if(!supabaseClient){cloudReady=false;return}const {data:sessionData}=await supabaseClient.auth.getSession();if(sessionData.session?.user){cloudUser=sessionData.session.user;cloudReady=true}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(t){tab=t;render()}function renderNav(){document.getElementById('nav').innerHTML=[['Hoje','☑'],['Rotina','▦'],['Pilares','✿'],['Evolução','▥']].map(([t,i])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><span>${i}</span>${t}</button>`).join('')}function render(){renderNav();const main=document.getElementById('main');let checked=data.checks[today()]||[],habits=data.habits.filter(h=>h.active && (h.days||[0,1,2,3,4,5,6]).includes(new Date().getDay()));if(tab==='Hoje'){main.innerHTML=`<section class="hero"><div class="eyebrow">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${data.name?'Olá, '+esc(data.name)+'!':'Sua vida merece cuidado.'}</h1><p>Pequenos passos. Mais equilíbrio. Mais presença.</p><div class="progresshead"><span>Seu progresso de hoje</span><b>${checked.length} de ${habits.length}</b></div><div class="progress"><span style="width:${habits.length?Math.min(100,checked.length/habits.length*100):0}%"></span></div></section><section class="panel"><div class="titleline"><h2>Meu checklist</h2><b>${habits.length?Math.round(checked.length/habits.length*100):0}%</b></div><p class="muted">Não precisa fazer tudo. Comece pelo que importa.</p>${habits.map(h=>`<label class="habit ${checked.includes(h.id)?'done':''}"><input type="checkbox" ${checked.includes(h.id)?'checked':''} onchange="toggle('${h.id}')"><span class="habiticon" aria-hidden="true">${esc(iconFor(h))}</span><div><b>${esc(h.title)}</b><small>${esc(h.pillar)}</small></div></label>`).join('')}<div class="sectionlabel">HÁBITOS PRÉ-DEFINIDOS · TOQUE PARA ADICIONAR</div><div class="presetgrid">${presets.map(h=>{let exists=data.habits.some(x=>x.id===h.id);return `<button class="preset" ${exists?'disabled':''} onclick="addPreset('${h.id}')"><span>${h.icon}</span><span>${esc(h.title)}${exists?'<br><small>Já adicionado</small>':''}</span></button>`}).join('')}</div><div class="sectionlabel">OU CRIE SEU PRÓPRIO HÁBITO</div><div class="addform"><input class="wide" id="newhabit" placeholder="Nome do novo hábito"><select id="newicon" aria-label="Ícone do hábito">${icons.map(i=>`<option value="${i}">${i}</option>`).join('')}</select><select id="newpillar" aria-label="Área do hábito"><option>Corpo</option><option>Fé</option><option>Mente</option><option>Lar</option><option>Família</option><option>Pessoal</option></select><button class="primary wide" onclick="addHabit()">＋ Adicionar hábito</button></div></section><section class="panel"><h2>Como quero me sentir?</h2><textarea id="note" rows="3" placeholder="Escreva uma intenção ou conquista...">${esc(data.notes[today()]||'')}</textarea><p class="note">Sua reflexão fica salva neste navegador.</p></section>`;document.getElementById('note').addEventListener('input',e=>{data.notes[today()]=e.target.value;save()});}else if(tab==='Rotina'){main.innerHTML=`<section class="panel"><h2>Minha rotina</h2><p class="muted">Escolha um dia para consultar seu foco.</p><div class="days">${days.map((d,i)=>`<button class="${day===i?'sel':''}" onclick="setDay(${i})">${d.slice(0,3)}</button>`).join('')}</div><div class="plan"><span class="eyebrow">${days[day]}</span><div class="planrow"><span class="emoji">🏃</span><div><small>ATIVA CORPO</small><b>${plans[day].exercise}</b><p class="note">30 minutos sugeridos; adapte à sua condição e respeite seus limites.</p></div></div><div class="planrow"><span class="emoji">🏠</span><div><small>ATIVA LAR</small><b>${plans[day].home}</b></div></div><div class="planrow"><span class="emoji">📖</span><div><small>ATIVA ALMA</small><b>${plans[day].faith}</b></div></div></div><p class="note">Sexta-feira é o dia das roupas. O tempo de lavar, estender, dobrar e guardar pode ultrapassar 30 minutos.</p></section><section class="panel"><h2>Meus hábitos por dia</h2><p class="muted">Escolha em quais dias cada hábito aparece no checklist. As alterações são salvas neste aparelho.</p>${data.habits.filter(h=>h.active).map(h=>`<div class="habitsettings"><strong>${esc(iconFor(h))} ${esc(h.title)}</strong><div class="daychecks">${days.map((d,i)=>`<label class="daycheck"><input type="checkbox" ${h.days.includes(i)?'checked':''} onchange="setHabitDay('${h.id}',${i},this.checked)">${d.slice(0,3)}</label>`).join('')}</div></div>`).join('')}</section>`}else if(tab==='Pilares'){main.innerHTML=`<section class="panel"><h2>Meus pilares</h2><p class="muted">Uma rotina personalizada começa com pequenos passos em cada área.</p><div class="pillars"><article class="pillar"><div class="picon">🏃</div><h3>Ativa Corpo</h3><p>Exercícios em casa, movimento e descanso.</p></article><article class="pillar"><div class="picon">📖</div><h3>Ativa Alma</h3><p>Oração, Bíblia, meditação e gratidão.</p></article><article class="pillar"><div class="picon">🏡</div><h3>Ativa Lar</h3><p>Pequenas tarefas domésticas distribuídas na semana.</p></article><article class="pillar"><div class="picon">❤️</div><h3>Ativa Família</h3><p>Presença, conversas e atividades compartilhadas.</p></article></div><div class="row"><h3>Uma ideia para hoje</h3><p class="muted">Separe 15 minutos para uma atividade escolhida com alguém da família, sem celular por perto.</p></div></section>`}else if(tab==='Evolução'){let entries=Object.entries(data.checks).sort(([a],[b])=>b.localeCompare(a)).slice(0,7);let weekTotal=Object.entries(data.checks).filter(([d])=>{let dt=new Date(d+'T12:00:00'),now=new Date();let start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);let end=new Date(start);end.setDate(start.getDate()+7);return dt>=start&&dt<end}).reduce((n,[,a])=>n+a.length,0);main.innerHTML=`<section class="panel"><h2>Minha evolução</h2><p class="muted">Seu resumo com base nos registros deste aparelho.</p><div class="stats"><div class="stat"><span>Hábitos nesta semana</span><b>${weekTotal}</b></div><div class="stat"><span>Dias com registros</span><b>${entries.length}</b></div></div><h3>Registros recentes</h3>${entries.length?entries.map(([d,a])=>`<div class="habit"><div><b>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</b><small>${a.length} hábitos concluídos</small></div></div>`).join(''):'<p class="muted">Seu progresso começa aqui. Marque hábitos na tela Hoje para construir seu histórico.</p>'}</section>`}else{main.innerHTML=`<section class="panel"><h2>Ajustes</h2><p class="muted">Personalize seu espaço.</p><div class="row"><label for="name">Como podemos chamar você?</label><input class="field" id="name" value="${esc(data.name)}" placeholder="Seu nome ou apelido"></div><div class="row"><label for="reminder">Horário preferido para desacelerar</label><input class="field" id="reminder" type="time" value="${esc(data.reminder)}"></div><div class="row"><label><input id="reminderEnabled" type="checkbox" ${data.reminderEnabled?'checked':''} style="width:auto"> Quero receber lembrete para desacelerar</label><p class="note">A preferência fica salva neste aparelho. Notificações automáticas ainda não estão ativas nesta versão.</p></div><button class="primary" onclick="saveSettings()">Salvar preferências</button><div class="row"><h3>Conta e sincronização</h3><p class="muted">Você pode continuar usando sem cadastro. Ao entrar na conta, seus hábitos poderão ser sincronizados entre dispositivos.</p><div class="authbox"><div class="cloudtag">CONTA PROJETO ATIVA</div><div id="authstatus" class="authstatus">${cloudUser?'Conta conectada. As alterações serão sincronizadas com sua conta.':supabaseClient?'Conecte-se com seu e-mail para sincronizar seus hábitos.':'A conexão com o Supabase ainda precisa da chave publicável no arquivo supabase-config.js.'}</div><input id="authEmail" type="email" autocomplete="email" placeholder="Seu e-mail"><input id="authPassword" type="password" autocomplete="current-password" placeholder="Senha (mínimo 8 caracteres)"><div class="authbuttons"><button class="primary" onclick="signUp()">Criar conta</button><button class="secondary" onclick="signIn()">Entrar</button><button class="secondary danger" onclick="signOut()">Sair</button></div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="syncToCloud(true)">Sincronizar agora</button></div></div></div><p class="note">Os dados continuam salvos neste navegador. A sincronização só funcionará depois que a chave publicável estiver configurada e as políticas de segurança do banco estiverem corretas. Nunca coloque uma chave secreta neste aplicativo.</p></section>`}}function toggle(id){let c=data.checks[today()]||[];data.checks[today()]=c.includes(id)?c.filter(x=>x!==id):[...c,id];save();render()}function addHabit(){let el=document.getElementById('newhabit'),title=el.value.trim();if(!title)return;let icon=document.getElementById('newicon').value,pillar=document.getElementById('newpillar').value;data.habits.push({id:'custom-'+Date.now(),title,pillar,icon,active:true,days:[0,1,2,3,4,5,6]});save();render()}function addPreset(id){let h=presets.find(x=>x.id===id);if(!h||data.habits.some(x=>x.id===id))return;data.habits.push({...h,active:true,days:[0,1,2,3,4,5,6]});save();render()}function setDay(i){day=i;render()}function setHabitDay(id,d,enabled){let h=data.habits.find(x=>x.id===id);if(!h)return;h.days=h.days||[0,1,2,3,4,5,6];h.days=enabled?[...new Set([...h.days,d])]:h.days.filter(x=>x!==d);if(!h.days.length){h.days=[d];alert('Um hábito precisa estar programado para pelo menos um dia. Mantivemos este dia selecionado.')}save();render()}function saveSettings(){data.name=document.getElementById('name').value.trim();data.reminder=document.getElementById('reminder').value||'20:30';data.reminderEnabled=document.getElementById('reminderEnabled').checked;save();render();alert('Preferências salvas neste navegador. O horário fica registrado, mas as notificações automáticas ainda não estão ativas nesta demonstração.')}render();initAuth();

// Registra o service worker para permitir instalação e uso offline básico.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker não registrado:', err)); });
}
</script></body></html>
